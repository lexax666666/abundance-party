<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Abundance — Networking &amp; Social hero banner (1600×900)</title>
<!--
  Source for public/hero-banner.png. Regenerate with:

    cd apps/web && npx playwright screenshot \
      --viewport-size "1600,900" --wait-for-timeout 3000 \
      "file://$PWD/scripts/hero-banner/banner.html" public/hero-banner.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;600&display=swap"
  rel="stylesheet"
/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    background: #FAF6EC;
    color: #1C1917;
    font-family: "Cormorant Garamond", serif;
  }
  .corner { position: absolute; color: #C5963A; }
  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    text-align: center;
    padding-bottom: 30px;
  }
  .eyebrow {
    font-family: "Playfair Display", serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
  }
  h1 {
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: 190px;
    line-height: 0.9;
    background: linear-gradient(160deg, #D4AF37 10%, #C5963A 45%, #8C6B1F 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding: 0 40px 30px;
  }
  .details {
    display: flex;
    align-items: center;
    gap: 46px;
    font-size: 30px;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .details .item { display: flex; align-items: center; gap: 14px; }
  .details svg { width: 34px; height: 34px; stroke: #C5963A; fill: none; stroke-width: 1.5; }
  .details .sep { width: 1px; height: 40px; background: #C5963A; opacity: 0.6; }
  .sounds-by {
    font-family: "Playfair Display", serif;
    font-size: 22px;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    color: #8C6B1F;
  }
  .dj {
    font-family: "Great Vibes", cursive;
    font-size: 84px;
    line-height: 1;
    padding-bottom: 12px;
  }
  .dj .dj-prefix { font-family: "Playfair Display", serif; font-weight: 700; font-size: 64px; }
  .genres { font-size: 27px; letter-spacing: 0.25em; text-indent: 0.25em; color: #5C5347; }
  .bottom {
    display: flex;
    align-items: center;
    gap: 34px;
    margin-top: 10px;
    font-size: 24px;
    letter-spacing: 0.1em;
    color: #5C5347;
  }
  .admission {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border: 2px solid #C5963A;
    border-radius: 18px;
    padding: 10px 28px;
    color: #1C1917;
  }
  .admission .price { font-family: "Playfair Display", serif; font-weight: 700; font-size: 40px; }
  .admission .word { font-family: "Playfair Display", serif; font-size: 20px; letter-spacing: 0.3em; }
  .dot { color: #C5963A; font-size: 28px; }
</style>
</head>
